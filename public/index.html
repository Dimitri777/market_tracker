<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeScope - Market Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0e27;
      color: #e4e6eb;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #0f1419;
      border-right: 1px solid #1e2139;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 0;
    }

    .logo {
      padding: 0 20px 30px;
      font-size: 18px;
      font-weight: 700;
      color: #00bcd4;
    }

    .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      color: #8892a6;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      color: #e4e6eb;
      background: rgba(0, 188, 212, 0.1);
    }

    .nav-item.active {
      color: #e4e6eb;
      background: #00bcd4;
      border-left-color: #00bcd4;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 20px;
      border-top: 1px solid #1e2139;
      font-size: 12px;
      color: #546e7a;
    }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
    }

    /* MAIN CONTENT */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0a0e27 0%, #0f1419 100%);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* HEADER */
    .page-header {
      margin-bottom: 30px;
    }

    .page-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-header p {
      color: #8892a6;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* BUTTONS */
    .btn {
      background: #00bcd4;
      color: #0a0e27;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 14px;
    }

    .btn:hover {
      background: #00acc1;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: #00bcd4;
      border: 1px solid #00bcd4;
    }

    .btn-secondary:hover {
      background: rgba(0, 188, 212, 0.1);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    /* GRID */
    .grid {
      display: grid;
      gap: 20px;
      margin-bottom: 30px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* CARDS */
    .card {
      background: rgba(20, 30, 48, 0.8);
      border: 1px solid #1e2139;
      border-radius: 12px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .card-title-icon {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00bcd4;
    }

    /* METRICS */
    .metric-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .metric-label {
      font-size: 13px;
      color: #8892a6;
    }

    .metric-change {
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }

    .change-positive {
      color: #4caf50;
    }

    .change-negative {
      color: #ff6b6b;
    }

    /* BADGE */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-crypto {
      background: #7c3aed;
      color: white;
    }

    .badge-stock {
      background: #3b82f6;
      color: white;
    }

    .badge-low {
      background: #10b981;
      color: white;
    }

    .badge-medium {
      background: #f59e0b;
      color: white;
    }

    .badge-high {
      background: #ef4444;
      color: white;
    }

    /* ASSET ROW */
    .asset-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #1e2139;
    }

    .asset-row:last-child {
      border-bottom: none;
    }

    .asset-info {
      flex: 1;
    }

    .asset-name {
      font-size: 14px;
      font-weight: 600;
      color: #00bcd4;
    }

    .asset-description {
      font-size: 12px;
      color: #8892a6;
      margin-top: 2px;
    }

    .asset-price {
      text-align: right;
      flex: 1;
    }

    .price {
      font-size: 14px;
      font-weight: 600;
    }

    .change {
      font-size: 12px;
      margin-top: 2px;
    }

    /* LIST */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1e2139;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid #1e2139;
      font-weight: 600;
      color: #8892a6;
    }

    td {
      padding: 12px 8px;
      border-bottom: 1px solid #1e2139;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* FORM */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e4e6eb;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #141e30;
      border: 1px solid #1e2139;
      border-radius: 6px;
      color: #e4e6eb;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00bcd4;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* VIEW ALL */
    .view-all {
      color: #00bcd4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .view-all:hover {
      text-decoration: underline;
    }

    /* STRATEGY CARD */
    .strategy-card {
      background: rgba(20, 30, 48, 0.8);
      border: 1px solid #1e2139;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .strategy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .strategy-title {
      font-size: 18px;
      font-weight: 700;
    }

    .strategy-description {
      color: #8892a6;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .strategy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .strategy-item {
      background: rgba(20, 30, 48, 0.5);
      padding: 12px;
      border-radius: 6px;
    }

    .strategy-item-label {
      font-size: 11px;
      color: #8892a6;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .strategy-item-value {
      font-size: 14px;
      font-weight: 600;
    }

    .implementation-steps {
      margin-bottom: 20px;
    }

    .impl-step {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #e4e6eb;
    }

    .step-number {
      color: #00bcd4;
      font-weight: 700;
      min-width: 20px;
    }

    .pros-cons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .pro, .con {
      font-size: 13px;
    }

    .pro-con-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .pro-con-icon {
      min-width: 16px;
      text-align: center;
    }

    .pro-con-item.pro .pro-con-icon {
      color: #4caf50;
    }

    .pro-con-item.con .pro-con-icon {
      color: #ff6b6b;
    }

    /* SIGNAL */
    .signal-item {
      background: rgba(20, 30, 48, 0.8);
      border: 1px solid #1e2139;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .signal-name {
      font-size: 16px;
      font-weight: 700;
      color: #00bcd4;
    }

    .signal-strength {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #8892a6;
    }

    .strength-bar {
      height: 6px;
      background: #1e2139;
      border-radius: 3px;
      overflow: hidden;
      width: 200px;
      margin-bottom: 8px;
    }

    .strength-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #00bcd4);
      border-radius: 3px;
    }

    .signal-description {
      font-size: 13px;
      color: #8892a6;
      line-height: 1.5;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8892a6;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* SCROLL */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e2139;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2a3654;
    }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
      .strategy-grid {
        grid-template-columns: 1fr;
      }
      .pros-cons {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 150px;
      }
      .content {
        padding: 20px;
      }
      .grid-2, .grid-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo">
        <i class="fas fa-chart-line"></i> TradeScope
      </div>

      <nav>
        <div class="nav-item active" data-page="dashboard">
          <i class="fas fa-th-large"></i>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="watchlist">
          <i class="fas fa-star"></i>
          <span>Watchlist</span>
        </div>
        <div class="nav-item" data-page="portfolio">
          <i class="fas fa-briefcase"></i>
          <span>Portfolio</span>
        </div>
        <div class="nav-item" data-page="signals">
          <i class="fas fa-bolt"></i>
          <span>Signals</span>
        </div>
        <div class="nav-item" data-page="strategies">
          <i class="fas fa-chess"></i>
          <span>Strategies</span>
        </div>
        <div class="nav-item" data-page="paper">
          <i class="fas fa-flask"></i>
          <span>Paper Trading</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="market-status">
          <div class="status-dot"></div>
          <span>Live Data</span>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="content" id="content-area"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
